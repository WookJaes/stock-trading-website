services:
  app:
    build:
      context: .
    env_file:
      - .env
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    volumes:
      - strategy_data:/app/.data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  strategy-worker:
    build:
      context: .
    command: ["node", "worker/strategy-worker.js"]
    env_file:
      - .env
    restart: unless-stopped
    init: true
    volumes:
      - strategy_data:/app/.data
    depends_on:
      app:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  strategy_data:
